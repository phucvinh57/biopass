name: Security Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    # The action is not hardened against prompt injection; only run it on branches from this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          exclude-directories: app/src-tauri/icons,assets,docs/images,auth/face/models
          custom-security-scan-instructions: .github/security-review-instructions.txt
