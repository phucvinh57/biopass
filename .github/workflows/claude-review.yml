name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs; a maintainer can review those with /code-review locally.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Review this pull request for correctness bugs. Follow REVIEW.md exactly and
            use CLAUDE.md for project context. Read the PR description to understand the
            intended change and check that the diff actually achieves it, fits the rest of
            the system, and does not break callers elsewhere. For bug fixes, check the
            root cause is addressed, not just the symptom.

            If EVENT is "synchronize", this is a re-review: read your earlier comments with
            `gh pr view --comments`, review only the commits added since then, and do not
            repeat findings already raised. If you have already reviewed this PR 3 or more
            times, post only a summary asking the author to reconsider the approach.

            Post each finding as an inline comment on the exact line. Then post one
            top-level comment with the summary line required by REVIEW.md.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Read,Grep,Glob"
