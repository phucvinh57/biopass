name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Name of the release"
        required: true
        type: string
  workflow_call:
    inputs:
      release_name:
        description: "Name of the release"
        required: true
        type: string

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install system dependencies
        if: contains(matrix.runner, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y librsvg2-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev libpam0g-dev libcli11-dev rpm pkg-config libturbojpeg0-dev meson ninja-build python3-jinja2 python3-yaml python3-ply libudev-dev libdrm-dev libegl-dev libgles-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Cache libcamera build
        uses: actions/cache@v5
        with:
          path: auth/build
          key: ${{ runner.os }}-${{ matrix.arch }}-libcamera-${{ hashFiles('auth/BundleLibcamera.cmake', 'auth/PatchLibcameraNoCrypto.cmake') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract Version
        id: get_version
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_NAME:-$REF_NAME}"
          # It ends up in make, sed and file names: allow version characters only.
          case "$VERSION" in
            "" | *[!A-Za-z0-9._+-]*)
              echo "Invalid version: '$VERSION'" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # make stamps VERSION into Cargo.toml for the build and restores it after.
      - name: Build & package
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          rm -rf app/src-tauri/target/release/bundle/
          make package BUILD_TYPE="$BUILD_TYPE" VERSION="$VERSION"
          ls -R app/src-tauri/target/release/bundle/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          prerelease: ${{ contains(steps.get_version.outputs.version, 'rc') || contains(steps.get_version.outputs.version, 'beta') }}
          files: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            auth/face/models/*.onnx
