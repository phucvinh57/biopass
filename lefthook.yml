pre-commit:
  parallel: true
  jobs:
    - name: Biome check
      root: app/
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bun run lint {staged_files}

    - name: Clang Format
      root: auth/
      glob: "*.{cc,h}"
      # Let lefthook re-stage the formatted files. A `git add` inside the job
      # runs from auth/ with git's hook GIT_DIR set, which in a linked
      # worktree makes git treat auth/ as the top level and stage the file
      # at the wrong path (e.g. pam/pam.cc instead of auth/pam/pam.cc).
      run: clang-format -i {staged_files}
      stage_fixed: true

    - name: Rust Format
      root: app/src-tauri/
      glob: "*.rs"
      run: cargo fmt --all --check
