[package]
name = "biopass"
version = "1.4.2"
description = "Biometric Authentication System"
authors = ["phucvinh57"]
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin (rust-lang/cargo#8519).
name = "biopass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.23"
webkit2gtk = "2.0.1"
gtk = "0.18.2"
tokio = { version = "1", features = ["rt"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tempfile = "3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.0"
futures-util = "0.3"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"

[dev-dependencies]
# The TypeScript exporter is only used by the bindings_are_up_to_date test.
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
